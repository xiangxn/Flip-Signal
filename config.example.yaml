# =============================================================================
# Flip Signal — 完整配置文件
# =============================================================================
# 本文件包含 Flip Signal Detection 引擎的所有可配置项。
# 复制为 config.yaml 后修改即可使用。
#
# 运行时也可通过命令行 flag 覆盖部分参数：
#   go run ./cmd/flip -output data/flip_signals.jsonl -dashboard :8090
# =============================================================================

# ---------------------------------------------------------------------------
# 运行时参数（对应 main.go 命令行 flag 的默认值）
# ---------------------------------------------------------------------------
runtime:
  # 交易对符号，对应 Binance 的 trading pair
  # 默认值: BTCUSDT
  symbol: "BTCUSDT"

  # Polymarket 市场 slug 前缀，运行时自动拼接 "-<unix_timestamp>"
  # 例如 btc-updown-5m-1712345678
  # 默认值: btc-updown-5m
  slug_prefix: "btc-updown-5m"

  # Flip Signal 检测结果 JSONL 输出路径
  # 每行一条 FlipSignal JSON 记录
  # 默认值: data/flip_signals.jsonl
  output_path: "data/flip_signals.jsonl"

  # （可选）Lab 事件数据输出目录，JSONL 格式，按日切分
  # 与 cmd/lab 输出格式相同，包含完整的 ResearchSnapshot 序列
  # 留空表示不启用 lab 数据采集
  # 默认值: ""（不启用）
  lab_output_dir: "data/lab"

  # （可选）HTTP Dashboard 监听地址
  # 例如 ":8090" 监听所有网卡的 8090 端口
  # 留空表示不启动 Dashboard
  # 默认值: ""（不启用）
  dashboard_addr: ":8090"

# ---------------------------------------------------------------------------
# Polymarket SDK 配置
# ---------------------------------------------------------------------------
sdk:
  # HTTP 客户端超时时间
  # 默认值: 10s（SDK DefaultConfig）
  http_timeout: 10s

  # HTTP 调试模式，开启后打印请求/响应详情
  # 默认值: false
  http_debug: false

  # SOCKS5 代理地址（适用于网络受限地区）
  # 也可通过环境变量 POLYMARKET_PROXY 设置
  # 默认值: ""（不使用代理）
  # socks_proxy: "socks5://127.0.0.1:1080"

  polymarket:
    # Polygon 链 ID: 137 = 主网, 80002 = Amoy 测试网
    # 默认值: 137
    chain_id: 137

    # ------ API 端点 ------
    # CLOB REST API 基地址
    # 默认值: "https://clob.polymarket.com"
    clob_base_url: "https://clob.polymarket.com"

    # CLOB WebSocket 订阅地址
    # 默认值: "wss://ws-subscriptions-clob.polymarket.com"
    clob_ws_base_url: "wss://ws-subscriptions-clob.polymarket.com"

    # Gamma API 基地址（市场信息查询）
    # 默认值: "https://gamma-api.polymarket.com"
    gamma_base_url: "https://gamma-api.polymarket.com"

    # Data API 基地址（历史数据）
    # 默认值: "https://data-api.polymarket.com"
    data_api_base_url: "https://data-api.polymarket.com"

    # Live WebSocket 基地址（实时数据 RTDS）
    # 默认值: "wss://ws-live-data.polymarket.com"
    live_ws_base_url: "wss://ws-live-data.polymarket.com"

    # Relayer API 基地址（用于代理提交交易）
    # 默认值: "https://relayer-v2.polymarket.com"（SDK DefaultConfig）
    relayer_base_url: "https://relayer-v2.polymarket.com"

    # ------ 签名与认证 ------
    # 签名类型: 0 = EOA（普通钱包）, 1 = POLY_PROXY, 2 = POLY_GNOSIS_SAFE
    # 默认值: 2（SDK DefaultConfig）
    signature_type: 2

    # 钱包私钥（hex 格式，不含 0x 前缀）
    # 也可通过环境变量 POLYMARKET_OWNER_KEY 设置
    # 未配置时自动生成临时密钥，仅用于数据读取（paper trading 模式）
    # 默认值: ""（自动生成临时密钥，只读模式）
    owner_key: ""

    # CLOB API 凭证（L2 认证，用于下单 / 查询账户）
    # 也可分别通过环境变量设置：
    #   POLYMARKET_CLOB_KEY, POLYMARKET_CLOB_SECRET, POLYMARKET_CLOB_PASSPHRASE
    # 默认值: 不设置（只读模式够用）
    # clob_creds:
    #   key: ""
    #   secret: ""
    #   passphrase: ""

    # 代理钱包地址（用于 funder/operator 模式）
    # 也可通过环境变量 POLYMARKET_FUNDER 设置
    # 默认值: ""（不使用代理钱包）
    # funder_address: ""

    # Builder 佣金码（可选）
    # 默认值: 不设置
    # builder_code: ""

    # Builder API 凭证（可选，用于 GTC/GTD 等高级订单类型）
    # 默认值: 不设置
    # builder_creds:
    #   key: ""
    #   secret: ""
    #   passphrase: ""

    # Relayer 签名密钥（可选）
    # 默认值: 不设置
    # relayer_key:
    #   key: ""
    #   secret: ""
    #   passphrase: ""

# ---------------------------------------------------------------------------
# Binance 数据源配置
# ---------------------------------------------------------------------------
binance:
  # 交易对
  # 默认值: "BTCUSDT"
  symbol: "BTCUSDT"

  # WebSocket 流地址（aggTrade + depth20 多流复用）
  # 默认值: "wss://data-stream.binance.vision"
  stream_base_url: "wss://data-stream.binance.vision"

  # REST API 基地址（获取 5m K线开盘价 + 历史 K线预热）
  # 默认值: "https://data-api.binance.vision"
  rest_base_url: "https://data-api.binance.vision"

# ---------------------------------------------------------------------------
# Flip Signal Detection 引擎参数
# ---------------------------------------------------------------------------
# 以下参数均来自 flip.DefaultConfig()，与 Python 回测配置一致。
# 回测基准: 2026-08-12 网格搜索优化 — 232 信号, 50.9% WR, +62.40 P&L, 盈亏比 2.3
# ---------------------------------------------------------------------------
flip:
  # ===== Layer 0: 前置条件 (§2.1) =====

  # PM YES/NO 价格触发检测的阈值
  # 当某一边价格首次超过此值时触发信号检测
  # 默认值: 0.7
  trigger_threshold: 0.7

  # 多穿越重试模式
  # true  = 每个向上穿越 0.7 的上升沿都触发检测，首个评分通过者下注（新行为，推荐）
  # false = 仅首次穿越触发检测（旧行为，兼容）
  # 默认值: true
  allow_retry_crossings: true

  # 穿越前最少 snapshot 数，确保有足够的前置数据
  # 默认值: 5（5 × 5s = 25s 预热）
  min_pre_snaps: 5

  # 最大剩余秒数，只有 remaining_sec < 此值的穿越才有效
  # 窗口过早 = BTC 路径太短，信号质量不足
  # 默认值: 260（即窗口开始后至少经过 40s）
  max_remaining_sec: 260

  # ===== 振荡检测（Formula A 三条件，必须同时满足）=====

  # 路径效率阈值，path_eff ≤ 此值 → 候选振荡
  # 越低说明价格路径越曲折（非趋势性运动）
  # 默认值: 0.7（收紧，原 0.8 太宽松噪声大）
  path_eff_oscillating: 0.7

  # 噪声比阈值，noise_ratio > 此值 → 候选振荡
  # 噪声比越高说明微小波动越多
  # 默认值: 1.5（Formula A: 从 5.0 大幅放宽，旧值几乎不触发）
  noise_ratio_oscillating: 1.5

  # 翻转次数阈值，flips > 此值 → 候选振荡
  # 价格方向切换越频繁越像振荡
  # 默认值: 2（收紧，原 1 太宽松，假振荡多）
  flips_oscillating: 2

  # ===== T=0 穿线时刻质量否决（硬编码→可配置）=====

  # 路径效率下限，path_eff < 此值 → 趋势太模糊，否决
  # 默认值: 0.4
  path_eff_veto_min: 0.4

  # 噪声比上限，noise_ratio > 此值 → 价格太不稳定，否决
  # 默认值: 3.0
  noise_ratio_veto_max: 3.0

  # ===== 历史波动范围（tick-independent，基于 hist_avg_range）=====

  # 历史 K 线窗口大小，用于计算 hist_avg_range 基准
  # 默认值: 18（约 1.5 小时的历史参考）
  hist_window_n: 18

  # 区间扩展阈值，range_expansion < 此值 → BTC 几乎没动，PM 过度自信
  # 默认值: 0.5
  range_exp_threshold: 0.5

  # 区间扩展上限，range_expansion ≥ 此值 → F0 否决（真突破，取消信号）
  # 默认值: 1.5（收紧，原 2.0 让真突破也通过了）
  range_exp_max: 1.5

  # ===== 对手盘确认 (§2.7) — Formula A 三级评分 =====

  # 确认等待 tick 数（1 tick = 5s）
  # 穿越后等待此 tick 数，再采样对手盘价格计算 other_delta
  # 默认值: 2（从 5 改为 2：25s 时对面已充分反弹但入场价跑掉，FAK 无法成交）
  confirm_delay_ticks: 2

  # other_delta 硬下限，-999 表示禁用（Formula A 由评分体系处理）
  # 默认值: -999.0（禁用）
  od_hard_filter: -999.0

  # 对手盘大幅移动阈值，other_delta > 此值 → +3 分
  # 默认值: 0.05（Formula A 新增最高档）
  other_delta_vstrong: 0.05

  # 对手盘中幅移动阈值，other_delta > 此值 → +2 分
  # 默认值: 0.02（Formula A: 原 0.03）
  other_delta_strong: 0.02

  # 对手盘小幅移动阈值，other_delta > 此值 → +1 分
  # 默认值: 0.01（Formula A: 原 +2）
  other_delta_weak: 0.01

  # ===== BTC 相对位置 (§2.8) — Formula A 放宽 =====

  # NO>0.7 时: btc_position > 此值 → BTC 与 PM 方向背离 → +1 分
  # btc_position 是当前价格在日内 K 线范围中的归一化位置 [-1, 1]
  # 默认值: 0.1（Formula A: 从 0.5 大幅放宽）
  btc_pos_max: 0.1

  # YES>0.7 时: btc_position < 此值 → BTC 与 PM 方向背离 → +1 分
  # 默认值: -0.1（Formula A: 从 -0.5 大幅放宽）
  btc_pos_min: -0.1

  # ===== 入场价格 (§2.9) — Formula A 重新激活 =====

  # 极低入场价阈值，entry_price < 此值 → +1 分
  # 默认值: 0.20
  entry_cheap_strong: 0.20

  # 较低入场价阈值，entry_price < 此值 → +1 分（elif，不与上一档叠加）
  # 默认值: 0.25
  entry_cheap_weak: 0.25

  # 入场价上限 gate: 确认时刻（穿越 + confirm_delay_ticks×5s）对侧 ASK > 此值
  # → 信号无效（盈亏比已恶化，实盘 FAK 也无法以可接受价格成交）
  # ASK 口径: yes/no_price 存的是 best bid，对侧 ask = 1 - 触发侧 bid
  # （双 token 互补），与 trading.max_price 的 FAK 最优卖价校验口径一致
  # 与 trading.max_price 保持一致；0 = 禁用
  # 默认值: 0.45（2026-08-13: fill≥0.50 桶 EV 转负，0.45 为自然边界）
  max_entry_price: 0.45

  # ===== 评分权重 (§2.10) — Formula A =====

  # 对手盘大幅移动权重
  # 默认值: 3（Formula A 新增）
  w_other_delta_vstrong: 3

  # 对手盘中幅移动权重
  # 默认值: 2（Formula A: 原 4）
  w_other_delta_strong: 2

  # 对手盘小幅移动权重
  # 默认值: 1（Formula A: 原 2）
  w_other_delta_weak: 1

  # 振荡加分权重
  # 默认值: 1（降低，振荡信号胜率仅 31% 远低于趋势 45%）
  w_oscillating: 1

  # 极低价入场权重
  # 默认值: 1（Formula A: 原 2 且曾被禁用）
  w_cheap_entry_strong: 1

  # 较低价入场权重
  # 默认值: 1
  w_cheap_entry_weak: 1

  # 区间过小（BTC 没动）权重
  # 默认值: 2
  w_range_expansion: 2

  # BTC 极端位置背离权重
  # 默认值: 1
  w_btc_extreme: 1

  # ===== 入场阈值 (§2.10) =====

  # 开仓分数线，总分 ≥ 此值 → 开 1 share
  # 默认值: 5
  score_entry: 5

  # 加仓分数线，总分 ≥ 此值 → 加 2 shares
  # 99 = 禁用加仓（5s 数据评分精度不足以支持加仓）
  # 默认值: 99（禁用）
  score_add: 99

  # ===== 订单簿延迟风控 =====

  # 订单簿最大允许延迟（毫秒）。当 YES/NO 订单簿延迟超过此值时，
  # 信号被一票否决（L0 否决 — 数据不可信，不下注）。
  # 0 = 禁用延迟风控
  # 建议值: 300（300ms，通常 WS 延迟 < 100ms）
  # 默认值: 0（禁用）
  max_latency_ms: 0

# ---------------------------------------------------------------------------
# 实盘交易执行参数
# ---------------------------------------------------------------------------
# 安全第一：默认关闭。启用前请确保已配置 POLYMARKET_OWNER_KEY 和 CLOB 凭证。
trading:
  # 启动时是否启用实盘下单（true=实盘，false=纸面）
  # 也可通过命令行 -trading flag 覆盖
  # 默认值: false
  enabled: false

  # 交易记录 JSONL 输出路径（订单 + 结算）
  # 默认值: data/trades.jsonl
  output_path: "data/trades.jsonl"

  # 每信号投入 USDC
  # 也可通过命令行 -stake flag 覆盖
  # 默认值: 5.0
  stake_per_signal: 5.0

  # 最高允许价格：限价单的价格上限，直接设置绝对价格而非滑点百分比
  # 当盘口价很低时滑点百分比不实用（如 0.20 的 50% = 0.30，可能仍吃不到单）
  # FAK 校验按最优卖价（ask）比对；flip.max_entry_price 已按 ask 口径对齐
  # 默认值: 0.45（与 flip.max_entry_price 对齐，高盈亏比优先）
  max_price: 0.45

  # 日亏上限（USDC）：当日累计 realized 亏损达到此值后停止交易至次日 UTC 零点
  # 也可通过命令行 -max-loss flag 覆盖
  # 默认值: 10.0
  max_daily_loss: 10.0

  # 下单策略：
  #   "GTC" — 限价单挂在订单簿上等待对手方成交（默认，保守）
  #   "FAK" — 市价单即刻执行，未成交部分立即取消（适合时间敏感的信号交易）
  # 默认值: "GTC"
  order_strategy: "GTC"
