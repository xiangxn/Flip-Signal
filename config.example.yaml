# MQS (Market Quality Specification) Configuration
# BTC 5-minute Polymarket Last-Trading System

# Polymarket SDK configuration
sdk:
  # HTTP client settings
  http_timeout: 30s
  http_debug: false
  # SOCKS5 proxy (optional, for regions with restricted access)
  # socks_proxy: "socks5://127.0.0.1:1080"

  polymarket:
    # Polygon chain ID (137 = mainnet, 80002 = amoy testnet)
    chain_id: 137

    # API endpoints
    clob_base_url: "https://clob.polymarket.com"
    clob_ws_base_url: "wss://ws-subscriptions-clob.polymarket.com"
    gamma_base_url: "https://gamma-api.polymarket.com"
    data_api_base_url: "https://data-api.polymarket.com"
    live_ws_base_url: "wss://ws-subscriptions.polymarket.com/ws/live"

    # Signature type: 0 = EOA, 1 = POLY_1271 (proxy wallet)
    signature_type: 0

    # Wallet private key (hex, without 0x prefix)
    # Can also be set via POLYMARKET_OWNER_KEY env var
    owner_key: ""

    # CLOB API credentials (L2 authentication)
    # Can also be set via POLYMARKET_CLOB_KEY/SECRET/PASSPHRASE env vars
    # clob_creds:
    #   key: ""
    #   secret: ""
    #   passphrase: ""

    # Funder / proxy wallet address (optional)
    # Can also be set via POLYMARKET_FUNDER env var
    # funder_address: ""

# Logging configuration
logging:
  # Where to write MQS decision logs (JSONL format)
  decision_log_path: "data/mqs_decisions.jsonl"
  # Log level: debug, info, warn, error
  level: "info"

# MQS Strategy configuration (for polypilot integration)
strategies:
  mqs:
    # Base position size in USDC
    base_size: 5.0
    # Position size for strong signals (MQS >= 85)
    strong_size: 10.0
    # Decision log path
    log_path: "data/mqs_decisions.jsonl"

# Polypilot runtime configuration (when running inside polypilot)
runtime:
  strategy_tick_interval: 1s
  metrics_interval: 5m
