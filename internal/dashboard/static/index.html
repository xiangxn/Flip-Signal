<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <title>Dog@0.2 监控</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot" id="liveDot"></span>
      <h1>Dog@0.2</h1>
      <span class="badge" id="modeBadge">—</span>
    </div>
    <div class="uptime" id="uptime">—</div>
  </header>

  <main>
    <!-- 统计卡片 -->
    <section class="stats" id="stats">
      <div class="card stat"><div class="stat-val" id="statSignal">—</div><div class="stat-lbl">信号</div></div>
      <div class="card stat"><div class="stat-val" id="statWon">—</div><div class="stat-lbl">胜</div></div>
      <div class="card stat"><div class="stat-val" id="statLost">—</div><div class="stat-lbl">负</div></div>
      <div class="card stat"><div class="stat-val" id="statPending">—</div><div class="stat-lbl">待结算</div></div>
      <div class="card stat"><div class="stat-val" id="statWr">—</div><div class="stat-lbl">胜率</div></div>
      <div class="card stat"><div class="stat-val" id="statPnl">—</div><div class="stat-lbl">累计 P&amp;L</div></div>
      <div class="card stat"><div class="stat-val" id="statDd">—</div><div class="stat-lbl">最大回撤</div></div>
      <div class="card stat"><div class="stat-val" id="statDay">—</div><div class="stat-lbl">逐日盈利</div></div>
    </section>

    <!-- 当前窗口 -->
    <section class="card window">
      <div class="win-head">
        <h2>当前窗口</h2>
        <span class="engine-state" id="engineState">—</span>
      </div>
      <div class="win-slug">
        <a id="winSlugLink" href="#" target="_blank" rel="noopener">等待下一个窗口…</a>
      </div>
      <div class="win-grid">
        <div class="side up">
          <div class="side-name">UP (=YES)</div>
          <div class="side-bid" id="upBid">—</div>
          <div class="side-ask">ask <span id="upAsk">—</span></div>
        </div>
        <div class="side down">
          <div class="side-name">DOWN (=NO)</div>
          <div class="side-bid" id="downBid">—</div>
          <div class="side-ask">ask <span id="downAsk">—</span></div>
        </div>
      </div>
      <div class="win-meta">
        <span>剩余 <b id="winRem">—</b>s</span>
        <span>book_lat <b id="winLat">—</b>ms</span>
        <span>twap_age <b id="winTwap">—</b>ms</span>
        <span>spot <b id="winSpot">—</b> <span class="spot-age" id="winSpotAge">—</span></span>
        <span id="winCond" class="cond">—</span>
      </div>
    </section>

    <!-- 信号列表 -->
    <section class="card">
      <div class="list-head"><h2>信号</h2><button class="refresh" id="btnSignals">刷新</button></div>
      <div class="table-wrap">
        <table id="signalsTable">
          <thead><tr>
            <th>时间</th><th>侧</th><th>rem</th><th>fill</th><th>m45</th><th>dist_s</th><th>份额</th><th>结果</th><th>P&amp;L</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="empty" id="signalsEmpty" hidden>暂无信号</div>
    </section>

    <!-- 触底观测 -->
    <section class="card">
      <div class="list-head"><h2>触底观测（含失败）</h2><button class="refresh" id="btnObs">刷新</button></div>
      <div class="table-wrap">
        <table id="obsTable">
          <thead><tr>
            <th>时间</th><th>侧</th><th>rem</th><th>fill</th><th>m45</th><th>dist_s</th><th>判定</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="empty" id="obsEmpty" hidden>暂无观测</div>
    </section>
  </main>

  <footer class="foot" id="foot">—</footer>
  <script src="/static/app.js"></script>
</body>
</html>
